name: gift_grab
description: A game made using Flame where users grab presents to increase their scores.
publish_to: "none"
version: 1.7.1+48

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  bloc_error_handler:   ^0.0.4
  collection: ^1.17.0
  cupertino_icons: ^1.0.2 
  flutter_app_info: ^3.0.3 
  lottie: ^3.1.0
  gift_grab_ui:
    git: https://github.com/trey-a-hope/gift_grab_ui.git
  modal_util: ^0.0.2 


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - .env 
    - shorebird.yaml
    
