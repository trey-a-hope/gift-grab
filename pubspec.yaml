name: gift_grab
description: A game made using Flame where users grab presents to increase their scores.
publish_to: "none"
version: 1.7.1+48

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.17.0
  cupertino_icons: ^1.0.2 
  flutter_app_info: ^3.0.3 
  gap: ^3.0.1 
  intl: ^0.20.1 
  lottie: ^3.1.0
  material_design_icons_flutter: ^7.0.7296 
  gift_grab_ui:
    # git: https://github.com/trey-a-hope/gift_grab_ui.git
    path: /Users/treyhope/Desktop/Development/gift_grab_ui
