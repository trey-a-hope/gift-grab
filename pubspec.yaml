publish_to: "none"
version: 1.7.1+36

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  animated_search_bar: ^2.8.0
  build_runner: ^2.1.8
  cloudinary: ^1.2.0
  cupertino_icons: ^1.0.2
  dio: ^5.7.0
  equatable: ^2.0.5
  firebase_core: ^3.10.0
  flame: ^1.22.0
  flame_audio: ^2.0.5
  flame_bloc: ^1.12.4
  flutter_app_info: ^3.0.3
  flutter_bloc: ^8.1.3
  flutter_dotenv: ^5.2.1
  flutter_libphonenumber: ^2.5.0
  flutter_login: ^5.0.0
  flutter_secure_storage: ^9.2.4
  font_awesome_flutter: ^10.8.0
  gap: ^3.0.1
  google_sign_in: ^6.2.2
  go_router: ^14.2.3
  grpc: ^3.2.4
  image_picker: ^1.1.2
  intl: ^0.20.1
  jwt_decoder: ^2.0.1
  lottie: ^3.1.0
  material_design_icons_flutter: ^7.0.7296
  nakama: ^1.2.0
  path_provider: ^2.1.3
  sign_in_with_apple: ^6.1.4
  stream_transform: ^2.0.0
  timeago: ^3.2.2
  toastification: ^2.3.0
  toggle_switch: ^2.0.1
